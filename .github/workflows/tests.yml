# CI: static checks for the watchdog scripts and config.
#
# This does NOT test the model (the runners have no Apple Intelligence)
# and does NOT run the Watcher against a real Mac. It catches the class
# of bug that broke installation before: a script that fails to parse,
# a config the shell cannot source, or a helper the installer expects
# but the repo does not contain.
#
# A real end-to-end test still needs a Mac: see README.md, "Testing it".

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zsh syntax check (all scripts)
        run: |
          sudo apt-get install -y zsh
          for f in install.sh uninstall.sh watcher.sh watchdog-bootstrap.sh \
                   observer.sh review.sh lib/get-secret.sh \
                   scripts/setup-secrets.sh call-home.sh call-home-loop.sh \
                   click-allow.sh; do
            zsh -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done
          echo "All zsh scripts parse."

      - name: plist templates are well-formed XML
        run: |
          # Well-formed XML only — NOT plist validation: the templates
          # contain placeholders like __CHECK_INTERVAL__ inside an
          # <integer> element, which plistlib rejects (it must be a
          # number). The installer substitutes the real values. So we
          # check XML syntax with ElementTree, not plist types.
          python3 -c "
          import xml.etree.ElementTree as ET, glob
          for p in glob.glob('com.macwatchdog.*.plist'):
              ET.parse(p)
              print('OK', p)
          "

      - name: every agent the installer registers has a plist template
        run: |
          # Extract the agent names from install.sh's _agents array and
          # verify each has a com.macwatchdog.<name>.plist template.
          # This catches the class of bug where the agent list and the
          # plist files drift apart (or the list is a string, not an array).
          _agents=$(grep -oP '_agents=\(\K[^)]*' install.sh | tr ' ' '\n')
          if grep -q '_agents+=(call-home)' install.sh; then
            _agents="$_agents
          call-home"
          fi
          for p in $_agents; do
            if [ ! -f "com.macwatchdog.$p.plist" ]; then
              echo "MISSING PLIST for agent: $p"
              exit 1
            fi
            echo "OK agent $p -> com.macwatchdog.$p.plist"
          done
          # And the reverse: no orphan plist without an agent.
          for f in com.macwatchdog.*.plist; do
            _name=$(echo "$f" | sed 's/com.macwatchdog.//; s/.plist//')
            if ! echo "$_agents" | grep -qx "$_name"; then
              echo "ORPHAN PLIST (no agent in install.sh): $f"
              exit 1
            fi
          done

      - name: python syntax check
        run: python3 -m py_compile reasoning.py

      - name: config template is sourceable by zsh
        run: |
          zsh -c 'source watchdog.conf.example; echo "CHECK_INTERVAL=$CHECK_INTERVAL"'

      - name: installer references only files that exist in the repo
        run: |
          # Every file install.sh copies must be committed (not gitignored).
          # This is the check that would have caught the *secret* gitignore bug.
          for f in watcher.sh blueprint.md reasoning.py click-allow.sh \
                   call-home.sh call-home-loop.sh watchdog-bootstrap.sh \
                   observer.sh review.sh watchdog.conf.example \
                   watchdog.gitignore lib/get-secret.sh \
                   scripts/setup-secrets.sh; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "MISSING FROM REPO (but install.sh copies it): $f"
              exit 1
            fi
          done
          echo "All files the installer copies are committed."

      - name: no absolute URLs or placeholders in README install steps
        run: |
          if grep -q '<you>' README.md; then
            echo "README still contains a <you> placeholder URL."
            exit 1
          fi
          echo "README URLs are concrete."
